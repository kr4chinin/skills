<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="604" viewBox="0 0 1280 604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker>
</defs>
<rect width="1280" height="604" rx="24" fill="#ffffff"/>
<text x="40" y="68" font-size="32" font-weight="600" fill="#1f2328">Agents copy your comments. Keep the ones worth copying.</text>
<g transform="translate(0,-36)">
<rect x="40" y="140" width="540" height="460" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="640" y="140" width="600" height="460" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<path d="M596 370 L624 370" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="76" y="196" font-size="18" font-weight="600" fill="#59636e">Before</text>
<text x="676" y="196" font-size="18" font-weight="600" fill="#59636e">After</text>
<text x="76" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#a40e26">// increment the retry count</text>
<rect x="452" y="242" width="96" height="28" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
<text x="500" y="261" text-anchor="middle" font-size="14" font-weight="600" fill="#a40e26">Delete</text>
<text x="76" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1f2328">retries++</text>
<text x="76" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7d4e00">// HACK: API races on create</text>
<rect x="452" y="334" width="96" height="28" rx="14" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
<text x="500" y="353" text-anchor="middle" font-size="14" font-weight="600" fill="#7d4e00">Refactor</text>
<text x="76" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1f2328">await sleep(2000)</text>
<text x="76" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#116329">// Safari 16 ignores passive</text>
<rect x="452" y="426" width="96" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="500" y="445" text-anchor="middle" font-size="14" font-weight="600" fill="#116329">Keep</text>
<text x="76" y="491" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1f2328">el.addEventListener("wheel", h)</text>
<text x="676" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1f2328">retries++</text>
<text x="676" y="353" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7d4e00">await waitUntilCreated(id)</text>
<text x="676" y="399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#116329">// Safari 16 ignores passive</text>
<text x="676" y="445" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#1f2328">el.addEventListener("wheel", h)</text>
</g>
</svg>
