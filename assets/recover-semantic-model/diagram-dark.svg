<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="604" viewBox="0 0 1280 604" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
</defs>
<rect width="1280" height="604" rx="24" fill="#0d1117"/>
<text x="40" y="68" font-size="32" font-weight="600" fill="#e6edf3">Recover the model first. Then every finding names a row.</text>
<g transform="translate(0,-36)">
<rect x="40" y="140" width="540" height="460" rx="16" fill="#161b22" stroke="#30363d"/>
<rect x="640" y="140" width="600" height="460" rx="16" fill="#161b22" stroke="#30363d"/>
<path d="M596 370 L624 370" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
<text x="76" y="186" font-size="18" font-weight="600" fill="#e6edf3">In the code</text>
<text x="76" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9198a1">one import, written in two places</text>
<rect x="76" y="246" width="468" height="52" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="96" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e6edf3">on chunk: insert rows · rows_done += n · ack</text>
<rect x="76" y="314" width="468" height="172" rx="10" fill="#3a1418" stroke="#f85149" stroke-width="2"/>
<text x="96" y="342" font-size="13" font-weight="600" fill="#ffa198">one fact, stored twice</text>
<rect x="96" y="358" width="206" height="104" rx="10" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
<text x="199" y="402" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#ffa198">import_rows</text>
<text x="199" y="428" text-anchor="middle" font-size="13" fill="#ffa198">one row per line</text>
<rect x="318" y="358" width="206" height="104" rx="10" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
<text x="421" y="402" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#ffa198">imports.rows_done</text>
<text x="421" y="428" text-anchor="middle" font-size="13" fill="#ffa198">a counter of those rows</text>
<text x="76" y="560" font-size="15" fill="#9198a1">Nothing says which step may repeat.</text>
<text x="676" y="186" font-size="18" font-weight="600" fill="#e6edf3">What the agent reports</text>
<rect x="676" y="206" width="528" height="126" rx="10" fill="#0d1117" stroke="#30363d"/>
<text x="694" y="231" font-size="13" font-weight="600" fill="#9198a1">Model</text>
<text x="694" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ffa198">S2  rows_done</text>
<text x="1186" y="258" text-anchor="end" font-size="12" fill="#ffa198">copy of S3</text>
<text x="694" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">S3  import_rows</text>
<text x="1186" y="284" text-anchor="end" font-size="12" fill="#9198a1">source</text>
<text x="694" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ffa198">T2  chunk delivered</text>
<text x="1186" y="310" text-anchor="end" font-size="12" fill="#ffa198">twice: rows safe, counter not</text>
<rect x="676" y="350" width="528" height="158" rx="10" fill="#3a1418" stroke="#f85149" stroke-width="2"/>
<text x="696" y="380" font-size="15" font-weight="600" fill="#ffa198">F1  “Import complete” while lines are missing</text>
<text x="696" y="403" font-size="13" fill="#ffa198">rows S2, S3, T2 · smallest breaking input:</text>
<rect x="696" y="418" width="154" height="36" rx="18" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
<text x="773" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#ffa198">1  chunk committed</text>
<rect x="863" y="418" width="154" height="36" rx="18" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
<text x="940" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#ffa198">2  crash before ack</text>
<rect x="1030" y="418" width="154" height="36" rx="18" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
<text x="1107" y="441" text-anchor="middle" font-size="13" font-weight="600" fill="#ffa198">3  chunk redelivered</text>
<text x="696" y="484" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ffa198">rows_done = 200, import_rows = 100</text>
<text x="676" y="560" font-size="15" fill="#9198a1">Each finding names its rows and the smallest input that breaks it.</text>
</g>
</svg>
